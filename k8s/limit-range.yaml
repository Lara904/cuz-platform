# Valeurs par défaut et bornes pour tout conteneur du namespace (filet de sécurité
# si un manifeste oublie ses resources).
apiVersion: v1
kind: LimitRange
metadata:
  name: cuz-container-limits
  namespace: cuz-acmecorp
spec:
  limits:
  - type: Container
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    max:
      cpu: "2"
      memory: 2Gi
