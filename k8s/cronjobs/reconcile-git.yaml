# k8s/cronjobs/reconcile-git.yaml
# Réconciliation Gitea (quotidienne). Schedule : 0 3 * * * (UTC). Conforme PSS restricted.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reconcile-git
  namespace: cuz-acmecorp
  labels:
    app: cuz-worker
    job: reconcile-git
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: cuz-worker
            job: reconcile-git
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: worker
            image: cuz-worker:0.1.0
            imagePullPolicy: IfNotPresent
            command: ["python", "-m", "packages.ingestion.reconcile", "--source", "gitea", "--tenant", "acmecorp"]
            envFrom:
            - secretRef:
                name: cuz-acmecorp-secrets
            env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 64Mi
