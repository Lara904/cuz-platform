# Autoscaling sur CPU (metrics-server fourni par k3d). Requiert les requests du Deployment.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cuz-api
  namespace: cuz-acmecorp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cuz-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
